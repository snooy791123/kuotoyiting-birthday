<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星光旅程｜YiTing 遊戲模式</title><link rel="stylesheet" href="game.css?v=motion-v4"></head><body>
<div id="paintedWorld" aria-hidden="true"></div><img id="yitingArt" src="game-yiting-v2.png" alt="" hidden><img id="membersArt" src="game-members-v3.png" alt="" hidden><img id="walkArt" src="game-walk-v3.png" alt="" hidden><canvas id="world" aria-label="YiTing 的第三人稱星光世界"></canvas>
<header><a href="./">← 電影模式</a><span>10:20 PM / ASTERUM</span><button id="music">開啟音樂</button></header>
<section class="mission"><p class="eyebrow">YITING'S STARLIGHT JOURNEY</p><h1>穿越星光</h1><p id="task">走向銀虎，接受今晚的邀請。</p><div id="stars" aria-label="星光收集進度"></div><p id="distance"></p></section>
<aside class="guide">WASD / 方向鍵移動 · 拖曳畫面轉動鏡頭<br>E 與角色交談 · P 暫停</aside>
<div class="controls"><div id="joystick" aria-label="拖曳搖桿移動"><span id="stickThumb"></span></div><div class="pad" aria-label="移動控制"><button data-key="ArrowUp" aria-label="向前走">↑</button><div><button data-key="ArrowLeft" aria-label="向左走">←</button><button data-key="ArrowDown" aria-label="向後走">↓</button><button data-key="ArrowRight" aria-label="向右走">→</button></div></div><div class="actions"><button id="route">沿星光前往</button><button id="pause">暫停</button><button id="talk" disabled>靠近星光</button></div></div>
<dialog id="conversation"><img id="portrait" alt=""><p id="place" class="eyebrow"></p><h2 id="name"></h2><p id="words"></p><button id="continue">繼續旅程</button><a id="filmLink" href="./?chapter=5&gift=1" hidden>進入生日電影與許願彩蛋 →</a></dialog>
<dialog id="welcome"><p class="eyebrow">A LITTLE PLAYABLE MIRACLE</p><h2>今晚，換妳走進星光。</h2><img src="assets/reference-b.webp" alt="YiTing 灰帽、黑長髮、酒紅上衣與淺灰外套三視圖"><p>操控 YiTing 與五位成員相遇。收集希望、溫柔、快樂、勇氣與陪伴，讓只屬於妳的舞台亮起。</p><p class="small">角色依原作三視圖製作為動漫插畫，搭配星光城堡與景深空間；相遇時呈現原作畫面與小說對白。桌機用方向鍵，手機拖曳搖桿，拖曳場景轉動鏡頭。</p><button id="begin">走進 10:20 PM</button><button id="restart">重新開始旅程</button><p id="error" role="status"></p></dialog>
